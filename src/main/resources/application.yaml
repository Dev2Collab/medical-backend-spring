spring:
    application:
        name: medical_backend_spring
#security credentials
    security:
        user:
            name: ${SECURITY_USERNAME:hema}
            password: ${SECURITY_PASSWORD:12345}

# database credentials
    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medical_db}
        username: ${DATABASE_USERNAME:postgres}
        password: ${DATABASE_PASSWORD:0000}
        driver-class-name: org.postgresql.Driver

#hibernate settings
    jpa:
        hibernate.ddl-auto: update
        show-sql: true
# spring.jpa.properties.hibernate.format_sql=true

#jsp settings
    mvc:
        view:
            suffix: .jsp
            prefix: /WEB-INF/views/

#logging settings
logging:
    level:
        org:
            springframework:
                security: ${SPRING_SECURITY_LOG_LEVEL:TRACE}

    pattern:
        console: ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
