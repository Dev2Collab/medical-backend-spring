spring.application.name=medical_backend_spring
#security credentials
spring.security.user.name=${SECURITY_USERNAME:hema}
spring.security.user.password=${SECURITY_PASSWORD:12345}

#database credentials
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medical_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver

#hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

#jsp settings
spring.mvc.view.suffix=.jsp
spring.mvc.view.prefix=/WEB-INF/views/

#logging settings
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}
logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
